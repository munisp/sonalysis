services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: sonalysis, POSTGRES_USER: sonalysis, POSTGRES_PASSWORD: sonalysis}
    ports: ['5432:5432']
    volumes: ['./postgres:/docker-entrypoint-initdb.d']
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
  redpanda:
    image: redpandadata/redpanda:v24.3.6
    command: [redpanda, start, --overprovisioned, --smp, '1', --memory, 1G, --reserve-memory, 0M, --node-id, '0', --check=false]
    ports: ['9092:9092','9644:9644']
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment: {discovery.type: single-node, DISABLE_SECURITY_PLUGIN: 'true', OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'}
    ports: ['9200:9200']
  apisix:
    image: apache/apisix:3.11.0-debian
    depends_on: [redpanda]
    ports: ['9080:9080','9180:9180']
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment: {KEYCLOAK_ADMIN: admin, KEYCLOAK_ADMIN_PASSWORD: admin}
    ports: ['8081:8080']
  permify:
    image: ghcr.io/permify/permify:latest
    command: serve
    ports: ['3476:3476','3478:3478']
  temporal:
    image: temporalio/auto-setup:1.25
    environment: {DB: postgresql, DB_PORT: 5432, POSTGRES_USER: sonalysis, POSTGRES_PWD: sonalysis, POSTGRES_SEEDS: postgres}
    depends_on: [postgres]
    ports: ['7233:7233']
  fluvio:
    image: infinyon/fluvio:stable
    profiles: ['fluvio']
    ports: ['9003:9003']
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:latest
    profiles: ['ledger']
    command: start --addresses=0.0.0.0:3000 --development
    ports: ['3000:3000']
  mojaloop:
    image: mojaloop/central-ledger:v18.2.1
    profiles: ['mojaloop']
    environment: {DB_ADAPTER: postgres, DB_HOST: postgres, DB_USER: sonalysis, DB_PASSWORD: sonalysis, DB_DATABASE: sonalysis}
    depends_on: [postgres]
  sonalysis-api:
    build: ..
    environment: {MODEL_DIR: /app/artifacts, POSTGRES_DSN: postgresql+asyncpg://sonalysis:sonalysis@postgres:5432/sonalysis, REDIS_URL: redis://redis:6379/0, KAFKA_BOOTSTRAP: redpanda:9092}
    depends_on: [postgres,redis,redpanda]
    ports: ['8080:8080']
