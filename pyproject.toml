[project]
name = "sonalysis-platform"
version = "0.1.0"
description = "End-to-end multi-tenant fraud detection platform with PyTorch and graph features"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic-settings>=2.6,<3",
  "torch>=2.4,<3", "numpy>=2,<3", "pandas>=2.2,<3", "scikit-learn>=1.5,<2",
  "sqlalchemy[asyncio]>=2.0,<3", "asyncpg>=0.29,<1", "redis>=5,<6",
  "aiokafka>=0.11,<1", "httpx>=0.27,<1", "prometheus-client>=0.21,<1"
]

[project.scripts]
sonalysis-api = "sonalysis.api:run"
sonalysis-train = "sonalysis.training:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
